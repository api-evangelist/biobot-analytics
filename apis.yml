aid: biobot-analytics
name: Biobot Analytics
description: >-
  Biobot Analytics is a wastewater intelligence company that measures human
  health signals in sewage to deliver population-level public health data.
  Founded out of MIT in 2017, Biobot analyzes wastewater samples for pathogens
  (SARS-CoV-2, influenza, RSV, mpox), substances (opioids and other drugs), and
  other biomarkers, turning them into de-identified, community-scale
  intelligence. It serves federal government, state and local government,
  pharmaceutical and life-science organizations, healthcare systems, and
  wastewater treatment plants, who access results and dashboards through
  Biobot's customer data-exploration platform. Biobot is a venture-backed
  company in the DCVC portfolio. This profile currently exposes no public
  developer API; Biobot delivers data via reports and a login-gated platform
  rather than an open API program.
